[project]
name = "historia-extera"
version = "0.10.0"
description = "Historia Extera — procedural world history generator and viewer."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
docs = [
    "mkdocs-materialx==10.2.0",
    "properdocs==1.6.7",
]

[tool.uv]
default-groups = ["docs"]
package = false

# One version for the whole project (see Directory.Build.props). bump-my-version keeps the
# mirrors in step: `make bump-patch` / `bump-minor` / `bump-major`, or `make bump PART=...`.
# Committing and tagging stay manual — this repository is worked through GitButler.
[tool.bumpversion]
current_version = "0.10.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
commit = false
tag = false
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "Directory.Build.props"
search = "<Version>{current_version}</Version>"
replace = "<Version>{new_version}</Version>"

[[tool.bumpversion.files]]
filename = "src/HistoryEngine/Serialization/WorldExporter.cs"
search = "EngineVersion = \"{current_version}\""
replace = "EngineVersion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "macos/HistoriaExteraApp/Info.plist"
search = "<key>CFBundleShortVersionString</key>\n\t<string>{current_version}</string>"
replace = "<key>CFBundleShortVersionString</key>\n\t<string>{new_version}</string>"

[[tool.bumpversion.files]]
filename = "viewer/package.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

# The lock file carries the package's own version twice, at two indents. Both are anchored on
# the package name so a dependency that happens to share the version is never rewritten.
[[tool.bumpversion.files]]
filename = "viewer/package-lock.json"
search = "\"name\": \"tested-telescope\",\n  \"version\": \"{current_version}\""
replace = "\"name\": \"tested-telescope\",\n  \"version\": \"{new_version}\""

[[tool.bumpversion.files]]
filename = "viewer/package-lock.json"
search = "\"name\": \"tested-telescope\",\n      \"version\": \"{current_version}\""
replace = "\"name\": \"tested-telescope\",\n      \"version\": \"{new_version}\""
