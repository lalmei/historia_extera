name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    name: Add merged pull requests to the draft
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read project version
        id: project_version
        shell: bash
        run: |
          version="$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' pyproject.toml | head -n1)"
          if [[ -z "$version" ]]; then
            echo "Could not read a semantic version from pyproject.toml." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # release-drafter/release-drafter regenerates the entire body on every
      # run, which throws away any hand-editing of the draft. This appends the
      # pull requests the draft does not mention yet and touches nothing else.
      - name: Add newly merged pull requests to the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.project_version.outputs.version }}
        run: python3 tools/append_release_notes.py

  autolabel:
    name: Autolabel pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Label pull request from gitmoji title
        uses: release-drafter/release-drafter/autolabeler@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
