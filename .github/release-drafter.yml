# yaml-language-server: $schema=https://raw.githubusercontent.com/release-drafter/release-drafter/main/schema.json

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) $AUTHORS'
change-title-escapes: '\<*_&'
sort-by: merged_at
sort-direction: ascending
category-template: '### $TITLE'
template: |
  ## What's Changed in v$RESOLVED_VERSION

  $CHANGES

  ## License

  Historia Extera is licensed under the [GNU Affero General Public License, version 3 only](https://www.gnu.org/licenses/agpl-3.0.html) (`AGPL-3.0-only`). Third-party dependencies retain their own licenses, and the name corpora retain their CC0 1.0 dedication.

categories:
  - type: pre-exclude
    when:
      labels:
        - skip-changelog
        - duplicate
        - invalid
  - title: '✨ Features'
    exclusive: true
    when:
      - labels:
          - enhancement
          - feature
      - conventional:
          types: [feat]
  - title: '🐛 Bug Fixes'
    exclusive: true
    when:
      - labels:
          - bug
      - conventional:
          types: [fix]
  - title: '💄 Visual'
    exclusive: true
    when:
      - labels:
          - style
      - conventional:
          types: [style]
  - title: '⚡️ Performance'
    exclusive: true
    when:
      - labels:
          - performance
      - conventional:
          types: [perf]
  - title: '♻️ Refactors'
    exclusive: true
    when:
      - labels:
          - refactor
      - conventional:
          types: [refactor]
  - title: '📝 Documentation'
    exclusive: true
    when:
      - labels:
          - documentation
      - conventional:
          types: [docs]
  - title: '✅ Tests'
    exclusive: true
    when:
      - labels:
          - test
      - conventional:
          types: [test]
  - title: '🔧 Maintenance'
    exclusive: true
    when:
      - labels:
          - chore
          - ci
      - conventional:
          types: [chore, ci, build]
  - title: '🧩 Other'
autolabeler:
  - label: enhancement
    title:
      # A feature title leads with the gitmoji for its domain, not with ✨,
      # so the domains this project writes about are listed out. Anything
      # missing still matches on the conventional `feat:` prefix below.
      - '/^\s*(✨|🔭|🎉|🌌|🪐|🌙|🌑|🌟)/'
      - '/^\s*(🌠|☀️|☄️|⭐|🌍|🗺️|🌊|⛰️)/'
      - '/^\s*(⛏️|🛣️|🧳|⚠️|🚶|🏔️|⚔️|🗡️)/'
      - '/^\s*(🏰|🎖️|🔥|🎭|😠|🤝|💔|👶)/'
      - '/^\s*(🧑|👤|👪|🏠|🏘️|🌱|🌾|📰)/'
      - '/^\s*(🏺|🏷️|🕰️|🧠|✏️|🌳|🏛️|⛪)/'
      - '/^\s*(🙏|🍎|♿|🎲|🔄|🦠)/'
      - '/^[^\w]*\s*feat\s*(\(|:)/i'
  - label: bug
    title:
      - '/^\s*🐛/'
      - '/^\s*🚑/'
      - '/^\s*🏚️/'
      - '/^\s*🛡️\s*(fix|bug|determinism)/i'
      - '/^[^\w]*\s*(fix|bug)\s*(\(|:)/i'
  - label: style
    title:
      - '/^\s*💄/'
      - '/^[^\w]*\s*style\s*(\(|:)/i'
  - label: performance
    title:
      - '/^\s*⚡️/'
      - '/^[^\w]*\s*perf\s*(\(|:)/i'
  - label: refactor
    title:
      - '/^\s*♻️/'
      - '/^[^\w]*\s*refactor\s*(\(|:)/i'
  - label: documentation
    title:
      - '/^\s*📝/'
      - '/^\s*📖/'
      - '/^\s*📚/'
      - '/^[^\w]*\s*docs\s*(\(|:)/i'
  - label: test
    title:
      - '/^\s*✅/'
      - '/^\s*🧪/'
      - '/^\s*🛡️\s*test/i'
      - '/^[^\w]*\s*test\s*(\(|:)/i'
  - label: ci
    title:
      - '/^\s*👷/'
      - '/^\s*💚/'
      - '/^[^\w]*\s*ci\s*(\(|:)/i'
  - label: chore
    title:
      - '/^\s*🔧/'
      - '/^\s*🧹/'
      - '/^\s*🚀/'
      - '/^\s*⬆️/'
      - '/^\s*📦/'
      - '/^\s*🚧/'
      - '/^\s*⚖️/'
      - '/^[^\w]*\s*(chore|build)\s*(\(|:)/i'
  - label: skip-changelog
    title:
      - '/^\s*🔖/'
      - '/^[^\w]*\s*release\s*(\(|:)/i'
